name: Build ECO FRACTION LAB animated cartoon
on:
  push:
    paths:
      - make_eco_cartoon.py
      - .github/workflows/build-eco-cartoon.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audio and video dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts gTTS Pillow numpy
      - name: Render talking animated characters and Russian voices
        run: python make_eco_cartoon.py
      - name: Publish MP4 and viewer
        run: |
          mv public/eco-fraction-lab-cartoon.mp4 ./
          mv public/eco-fraction-video.html ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eco-fraction-lab-cartoon.mp4 eco-fraction-video.html
          git commit -m "Publish ECO FRACTION LAB animated lesson" || exit 0
          git push
