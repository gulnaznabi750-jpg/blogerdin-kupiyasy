name: Build smooth ECO Fraction Lab lesson
on:
  push:
    paths:
      - make_eco_smooth_video.py
      - .github/workflows/build-eco-smooth.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install speech and rendering libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts gTTS Pillow numpy
      - name: Render smooth lesson and audio
        run: python make_eco_smooth_video.py
      - name: Publish video on public site
        run: |
          mv public/eco-fraction-lab-smooth-lesson.mp4 ./
          mv public/eco-fraction-smooth-video.html ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eco-fraction-lab-smooth-lesson.mp4 eco-fraction-smooth-video.html
          git commit -m "Publish smooth ECO Fraction Lab animation" || exit 0
          git push
