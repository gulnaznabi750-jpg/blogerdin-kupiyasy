name: Build ECO Fraction Lab video with beautiful animated characters
on:
  push:
    paths:
      - make_eco_beautiful_video.py
      - eco_motion_base64.txt
      - .github/workflows/build-eco-beautiful-video.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install edge-tts gTTS Pillow numpy
      - name: Render animated video and neural speech
        run: python make_eco_beautiful_video.py
      - name: Publish public video
        run: |
          mv public/eco-fraction-lab-animated-new.mp4 ./
          mv public/eco-fraction-new-video.html ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eco-fraction-lab-animated-new.mp4 eco-fraction-new-video.html
          git commit -m "Publish beautiful animated ECO Fraction Lab lesson" || exit 0
          git push
